name: CI

on:
  push:
    branches: [arena/01a0ae8f-pardiswindow1]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx drizzle-kit push --config drizzle.config.json --force
      - run: npm run build
      - name: Smoke test routes and contact API
        run: |
          npx next start -p 3000 &
          npx wait-on -t 60000 http://127.0.0.1:3000
          for p in / /about /products /projects /technology /quality /knowledge /contact /api/health; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || exit 1
          done
          curl -sf -X POST http://127.0.0.1:3000/api/contact \
            -H 'content-type: application/json' \
            -d '{"name":"CI Test","phone":"09120000000","topic":"quote","message":"automated smoke test message"}' | grep '"ok":true'
